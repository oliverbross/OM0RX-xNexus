[package]
name = "xnexus-tx-output"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Unwired offline final-output preparation candidate, not TX authority"

[workspace]

[dependencies]
xnexus-tx-prepare = { path = "../xlog-tx-prepare" }
modes = { path = "../../crates/modes" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[[example]]
name = "export-corpus"
path = "tools/export_corpus.rs"
