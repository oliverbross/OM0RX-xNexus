[package]
name = "xnexus-tx-paired"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Acceptance-only actual owner/Station offline period replay"
autotests = false

# Deliberately outside every application workspace and dependency graph.
[workspace]

[lib]
test = false
doctest = false

[[test]]
name = "replay"
path = "tests/replay.rs"

[dependencies]
tempo-core = { path = "../../crates/tempo-core" }
xnexus-tx-prepare = { path = "../xlog-tx-prepare" }
xnexus-tx-sequence = { path = "../xlog-tx-sequence" }
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
serde_json = "=1.0.154"
uuid = { version = "=1.23.2", features = ["v4", "serde"] }

[build-dependencies]
sha2 = "=0.10.9"
