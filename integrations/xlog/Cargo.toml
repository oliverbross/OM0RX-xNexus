[package]
name = "xnexus-xlog-client"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Native observation and owner-mediated receive/control client for xLog"

# Independent from the DSP workspace: contract tests never open station devices.
[workspace]

[dependencies]
base64 = "=0.23.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
